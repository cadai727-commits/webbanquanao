<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký | Urban Threads</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/customer.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body data-page="register">
    <header id="site-header"></header>
    <main class="auth-page">
      <div class="auth-card">
        <div class="section-tag">Tham gia ngay</div>
        <h1>Tạo tài khoản</h1>
        <p class="subtext">Đăng ký để nhận ưu đãi thành viên và thanh toán nhanh hơn.</p>
        <form id="register-form">
          <div class="form-grid">
            <div class="form-group">
              <label for="full-name">Họ tên</label>
              <input id="full-name" type="text" required />
              <div class="error-text"></div>
            </div>
            <div class="form-group">
              <label for="register-email">Email</label>
              <input id="register-email" type="email" required />
              <div class="error-text"></div>
            </div>
            <div class="form-group">
              <label for="phone">Điện thoại</label>
              <input id="phone" type="tel" required />
              <div class="error-text"></div>
            </div>
            <div class="form-group">
              <label for="register-password">Mật khẩu</label>
              <input id="register-password" type="password" required />
              <div class="error-text"></div>
            </div>
          </div>
          <div class="form-group" style="margin-top: 18px;">
            <label for="confirm-password">Xác nhận mật khẩu</label>
            <input id="confirm-password" type="password" required />
            <div class="error-text"></div>
          </div>
          <label style="display:flex; gap: 10px; margin-top: 18px; align-items: center;">
            <input type="checkbox" id="terms" /> Tôi đồng ý với điều khoản và điều kiện.
          </label>
          <button class="btn btn-primary" type="submit" style="width:100%; margin-top: 18px;">Đăng ký</button>
        </form>
      </div>
    </main>
    <footer id="site-footer"></footer>

    <script src="js/storage.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <div></div>
  </body>
</html>
