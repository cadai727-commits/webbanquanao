<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập | Urban Threads</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/customer.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body data-page="login">
    <header id="site-header"></header>
    <main class="auth-page">
      <div class="auth-card">
        <div class="section-tag">Chào mừng quay lại</div>
        <h1>Đăng nhập</h1>
        <p class="subtext">Truy cập tài khoản và quản lý đơn hàng của bạn.</p>
        <form id="login-form">
          <div class="form-group">
            <label for="login-email">Email hoặc tên đăng nhập</label>
            <input id="login-email" type="text" required />
            <div class="error-text"></div>
          </div>
          <div class="form-group">
            <label for="login-password">Password</label>
            <div style="position: relative;">
              <input id="login-password" type="password" required />
              <button type="button" class="toggle-password" data-target="login-password" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; color: var(--color-muted);">Hiện</button>
            </div>
            <div class="error-text"></div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin: 10px 0 18px;">
            <label style="display:flex; gap:8px; align-items:center;"><input type="checkbox" /> Ghi nhớ tôi</label>
            <a href="forgot-password.html">Quên mật khẩu?</a>
          </div>
          <button class="btn btn-primary" type="submit" style="width:100%;">Đăng nhập</button>
        </form>
        <p style="margin-top: 18px; text-align:center; color: var(--color-muted);">
          Chưa có tài khoản? <a href="register.html">Tạo tài khoản</a>
        </p>
      </div>
    </main>
    <footer id="site-footer"></footer>

    <script src="js/storage.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
